<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作物成熟时间计算器</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
}
.container {
    max-width: 400px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h2 {
    text-align: center;
}
label {
    display: block;
    margin-top: 15px;
}
input {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
}
button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}
.result {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
}
</style>
</head>

<body>
<div class="container">
    <h2>🌱 作物成熟时间计算器</h2>

    <label>成熟剩余时间</label>
    小时：<input type="number" id="x" min="0">  
    分钟：<input type="number" id="y" min="0">

    <label>作物总时间（小时）</label>
    <input type="number" id="dHours" min="0" step="0.1">

    <label>当前水分可维持时间</label>
    小时：<input type="number" id="eH" min="0">  
    分钟：<input type="number" id="eM" min="0">

    <button onclick="calc()">计算成熟时间</button>

    <div class="result" id="result"></div>
</div>

<script>
function toMin(h, m) {
    return h * 60 + m;
}

function calc() {
    let x = Number(document.getElementById("x").value);
    let y = Number(document.getElementById("y").value);
    let dHours = Number(document.getElementById("dHours").value);
    let eH = Number(document.getElementById("eH").value);
    let eM = Number(document.getElementById("eM").value);

    let a = toMin(x, y);
    let d = dHours * 60 / 3;   // 关键改动：小时 → 分钟 → ÷3
    let e = toMin(eH, eM);
    let b = d - e;

    let c = (a - b / 4) * 0.8;

    let ch = Math.floor(c / 60);
    let cm = Math.round(c % 60);

    document.getElementById("result").innerText =
        "成熟还需要：" + ch + " 小时 " + cm + " 分钟";
}
</script>
</body>
</html>
